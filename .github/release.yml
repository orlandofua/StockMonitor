# Groups the automatically generated release notes by pull request label.
changelog:
  exclude:
    labels:
      - skip-release
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Maintenance
      labels:
        - tech-debt
        - ci
    - title: Docs
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
